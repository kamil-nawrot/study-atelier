name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [develop, main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui:
    name: UI library
    if: github.event_name == 'push'
    uses: ./.github/workflows/ui.yml

  migrations:
    name: Migrations on local Supabase
    if: github.event_name == 'push'
    uses: ./.github/workflows/migrations.yml

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'push' && (github.ref_name == 'main' && 'production' || 'develop') || '' }}
    env:
      CLOUDFLARE_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      SUPABASE_URL: ${{ github.event_name == 'pull_request' && 'https://test.supabase.co' || secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ github.event_name == 'pull_request' && 'test-key' || secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @study-atelier/web lint

      - name: Type check
        run: pnpm --filter @study-atelier/web check

      - name: Install Playwright Chromium
        run: pnpm --filter @study-atelier/web exec playwright install --with-deps --only-shell chromium

      - name: Unit and component tests with coverage
        run: pnpm --filter @study-atelier/web test:coverage

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('apps/web/coverage/coverage-summary.json') != '' }}
        run: node .github/scripts/coverage-summary.mjs "Web app" apps/web/coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage thresholds only go up
        run: node .github/scripts/coverage-ratchet.mjs apps/web/vite.config.ts apps/web/coverage/coverage-summary.json

      - name: Build
        run: pnpm --filter @study-atelier/web build

      - name: Create Cloudflare Pages project
        if: github.event_name == 'push' && env.CLOUDFLARE_CONFIGURED == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! pnpm exec wrangler pages project list --json | jq -e 'any(.[]; .["Project Name"] == "study-atelier")' > /dev/null; then
            pnpm exec wrangler pages project create study-atelier --production-branch main
          fi

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && env.CLOUDFLARE_CONFIGURED == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          pnpm exec wrangler pages deploy --project-name study-atelier --branch "$DEPLOY_BRANCH" --commit-hash "$DEPLOY_COMMIT" | tee deploy.log
          url=$(grep -oE 'https://[^ ]+\.pages\.dev' deploy.log | tail -n 1 || true)
          echo "Deployed \`$DEPLOY_BRANCH\` to $url" >> "$GITHUB_STEP_SUMMARY"

  database:
    name: Database migrations
    needs: [web, migrations]
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
    concurrency:
      group: supabase-migrations-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      SUPABASE_CONFIGURED: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_DB_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7
        if: env.SUPABASE_CONFIGURED == 'true'
      - uses: supabase/setup-cli@v3
        if: env.SUPABASE_CONFIGURED == 'true'
        with:
          version: 2.120.0
      - name: Apply migrations
        if: env.SUPABASE_CONFIGURED == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          project_ref=$(echo "$SUPABASE_URL" | sed -E 's#^https://([^.]+)\.supabase\.co.*$#\1#')
          supabase link --project-ref "$project_ref"
          supabase db push
