name: Feedback digest
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: feedback-digest
  cancel-in-progress: false
jobs:
  digest:
    name: Mail the new feedback
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      deployment: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Send the reports not mailed yet
        if: vars.FEEDBACK_DIGEST == 'on'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: node .github/scripts/feedback-digest.mjs
