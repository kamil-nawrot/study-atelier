name: Unused images clean-up
on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:
    inputs:
      allow_mass_delete:
        description: Remove more than 100 images in one run
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  clean-up:
    name: Clean up ${{ matrix.environment }} images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'schedule' && '["develop","production"]' || github.ref_name == 'main' && '["production"]' || '["develop"]') }}
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Remove images no artwork or author uses
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ALLOW_MASS_DELETE: ${{ inputs.allow_mass_delete }}
        run: node .github/scripts/clean-up-unused-images.mjs
