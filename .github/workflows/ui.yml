name: UI library

on:
  pull_request:
    paths:
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.nvmrc'
      - 'stylelint.config.js'
      - 'stylelint/**'
      - 'eslint.config.base.js'
      - 'lint/**'
      - 'prettier.config.js'
      - 'design/**'
      - '.github/workflows/ui.yml'
      - '.github/scripts/coverage-summary.mjs'
      - '.github/scripts/coverage-ratchet.mjs'
  workflow_call:

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui:
    name: UI library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @study-atelier/ui lint

      - name: Type check and token CSS check
        run: pnpm --filter @study-atelier/ui check

      - name: Install Playwright Chromium
        run: pnpm --filter @study-atelier/ui exec playwright install --with-deps --only-shell chromium

      - name: Unit and component tests with coverage
        run: pnpm --filter @study-atelier/ui test:coverage

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('packages/ui/coverage/coverage-summary.json') != '' }}
        run: node .github/scripts/coverage-summary.mjs "UI library" packages/ui/coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage thresholds only go up
        run: node .github/scripts/coverage-ratchet.mjs packages/ui/vite.config.ts packages/ui/coverage/coverage-summary.json

      - name: Build Storybook
        run: pnpm --filter @study-atelier/ui build
