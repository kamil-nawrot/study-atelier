name: Migrations

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'docs/data-model/current.dbml'
      - 'tools/data-model/**'
      - 'apps/web/src/lib/shared/data/database.types.ts'
      - '.github/workflows/migrations.yml'
  workflow_call:

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migrations:
    name: Migrations on local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      - name: Start local Supabase and apply migrations
        run: supabase start

      - name: Replay migrations from scratch
        run: supabase db reset

      - name: Check generated database types
        run: |
          supabase gen types --lang typescript --local --schema public \
            | npx --yes prettier@3.9.10 --no-config --parser typescript > "$RUNNER_TEMP/database.types.ts"
          diff --unified apps/web/src/lib/shared/data/database.types.ts "$RUNNER_TEMP/database.types.ts" \
            || { echo "::error::apps/web/src/lib/shared/data/database.types.ts is stale. Run pnpm db:types and commit the result."; exit 1; }

      - name: Check the data model
        run: node tools/data-model/generate-dbml.mjs --check

      - name: Run the SQL tests
        run: |
          failed=0
          for test in supabase/tests/*.sql; do
            echo "::group::$test"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 --file "$test" || { echo "::error file=$test::$test failed"; failed=1; }
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
