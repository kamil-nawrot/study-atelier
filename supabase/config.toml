project_id = "study-atelier"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://127.0.0.1:5173/**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.email.template.confirmation]
subject = "Potwierdź adres e-mail w Study Atelier"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Ustaw nowe hasło w Study Atelier"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Potwierdź zmianę adresu e-mail w Study Atelier"
content_path = "./supabase/templates/email-change.html"

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
