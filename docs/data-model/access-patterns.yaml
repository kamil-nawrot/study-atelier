# Step 1 of the data model: access patterns.
# What the app shows or changes, independent of today's tables.
# today.whole: data fetched in full although the view shows a part of it.
# today.requests: Supabase requests of the view itself on a cold start, without the 10 requests of the
# shell (R01), from the spike ATL-403 measurement of 2026-10-30 on the screenshot fixtures (24 artworks).
# Wikimedia calls and image files are not counted. The first delivery step re-measures them (coverage.yaml).

legend:
  scope: { one: a single row, few: rows picked by id or filter, all: the whole set is shown }
  frequency:
    start: every app start
    view: every visit of the view
    flip: every arrow step
    hover: on pointer or tap
    key: per keystroke
    write: on save

reads:
  - id: R01
    name: Shell
    route: (app)/+layout
    shows: menu profile, review counter, career standing, announcements, legal version
    needs:
      - profile (one)
      - review_counts (aggregate)
      - career_standing (aggregate)
      - announcements (few)
    scope: one
    frequency: start
    today:
      requests: 10
      whole: []
      note: 'profiles read 4x; career is 4 requests including the unlock_exhibits write (W14); reloads on invalidation and after a write'

  - id: R02
    name: Wall
    route: /atelier
    shows: every artwork as a tile, filters
    needs:
      - 'artworks: all, tile columns'
      - 'image: first of each'
      - 'values: filter facets'
      - 'own field definitions: all'
    scope: all
    frequency: view
    today: { requests: 2, whole: [artworks], note: 'justified: the view shows all (ADR-0041/0042)' }

  - id: R03
    name: Artwork page
    route: /atelier/[number]
    shows: one artwork, its images, pins, values with summaries, visits, notes with links and marked terms, mentions of it
    needs:
      - 'artwork: one, by record_number'
      - 'images: of the artwork'
      - 'pins: of the artwork, each with its term name; the pin card shows the term definition when opened'
      - 'term picker in the pin dialog: every term name (light index)'
      - 'values: of the artwork, with summaries (era summaries included)'
      - 'visits: of the artwork'
      - 'note link labels: only the ids in the note'
      - 'term index: all, light, for marking'
      - 'term definition: one, on hover (R04)'
      - 'mentions: notes linking to this artwork'
      - 'own field definitions: all'
      - 'relations: of the artwork, both directions (R31)'
      - 'artwork count: one head request, only to dim "Porównaj" when the atelier holds a single artwork'
    scope: one
    frequency: view, flip
    today:
      requests: '18 cold / 19 per flip (most of a flip is the preloadData of the next artwork)'
      whole:
        - glossary_entries select *
        - artworks (note link labels)
        - card index (note link labels)
      note: 'mentions are already filtered in the database by the artwork path (notes_mentions needle); era_details and artwork_fields are re-read on every flip'

  - id: R04
    name: Term tooltip
    route: inside any note, definition or flashcard
    shows: name, category, definition and source of one term
    needs:
      - 'term: one, by id'
    scope: one
    frequency: hover
    today:
      requests: 0
      whole: [glossary_entries]
      note: 'served from the whole table loaded by the page'

  - id: R05
    name: Note link labels
    route: inside any note and every notes editor
    shows: current name of each '#' artwork and '@' value link
    needs:
      - 'artworks: few, by the record numbers in the note'
      - 'values: few, by the ids in the note'
    scope: few
    frequency: view
    today:
      {
        requests: 6,
        whole: [artworks, card index],
        note: 'labels resolve live, so a rename rewrites nothing'
      }

  - id: R06
    name: Link suggestions
    route: note editor, after '#' or '@'
    shows: up to 8 matches for 2+ typed characters
    needs:
      - 'artworks or values: few, by phrase, limit 8'
    scope: few
    frequency: key
    today:
      requests: '0 per key'
      whole: [artworks, card index]
      note: 'preloaded in full with the editor; era suggestions and record-number prefix matching stay in the browser'

  - id: R07
    name: Value page
    route: /atelier/values/[kind]/[id]
    shows: one author, period, style, material or place with details, its artworks, visits (places), mentions
    needs:
      - 'value: one, with details'
      - 'artworks: of the value, tile columns'
      - 'visits: of the place'
      - 'mentions: notes linking to the value'
      - 'note link labels'
      - 'term index'
      - 'relations: of the author, both directions (R32)'
    scope: one
    frequency: view
    today: { requests: '9 cold / 8 warm', whole: [artworks, card index, glossary_entries] }

  - id: R08
    name: Card index
    route: /atelier/values
    shows: every value per category with usage counts, era/period/style tree
    needs:
      - 'values: all, with usage counts'
      - 'period_eras: all'
      - 'style_periods: all'
      - 'own field values: all'
      - 'timeline events: all'
    scope: all
    frequency: view
    today: { requests: 7, whole: [], note: 'justified; 5 queries could be one (T9)' }

  - id: R09
    name: Glossary list
    route: /atelier/glossary
    shows: every term with category and first sentence of definition
    needs:
      - 'terms: all, with name, category and definition lead'
    scope: all
    frequency: view
    today: { requests: 1, whole: [], note: 'select * incl. full definitions and sources' }

  - id: R10
    name: Glossary entry
    route: /atelier/glossary/[id]
    shows: one term with the other terms marked in its definition, the loupe views of its pins, artworks pinned with it, notes that mention it
    needs:
      - 'term: one'
      - 'term index: for marking the definition'
      - 'pins: of the term, with their loupe view, crop path and image, in one query; crops and own thumbnails signed in one batch'
      - 'artworks: pinned with the term'
      - 'mentions: notes containing a phrase of the term, with titles and names'
    scope: one
    frequency: view
    today:
      requests: 3
      whole:
        [
          artworks,
          glossary_entries,
          card index (value names of mentions),
          notes of every table without filter
        ]

  - id: R11
    name: Timeline
    route: /atelier/timeline
    shows: every dated artwork and event
    needs:
      - 'artworks: all dated, tile columns'
      - 'timeline events: all'
    scope: all
    frequency: view
    today: { requests: 2, whole: [], note: 'justified' }

  - id: R12
    name: Chronicle
    route: /atelier/chronicle
    shows: every visit with place and excerpt
    needs:
      - 'visits: all, with place name and artwork count'
    scope: all
    frequency: view
    today:
      {
        requests: 2,
        whole: [artworks],
        note: 'excerpts show the stored link text, not current names'
      }

  - id: R13
    name: Visit page
    route: /atelier/chronicle/[id]
    shows: one visit, its artworks, its notes with links and marked terms (a visit is never a link target, so it has no mentions)
    needs:
      - 'visit: one, with place'
      - 'artworks: of the visit, tile columns'
      - 'note link labels'
      - 'term index'
    scope: one
    frequency: view
    today: { requests: 9, whole: [artworks, card index, glossary_entries] }

  - id: R14
    name: Review session
    route: /atelier/review
    shows: due cards, flashcards with marked notes, questions about artworks and term definitions
    needs:
      - 'review cards: due'
      - 'artwork facts: of the drawn cards'
      - 'term index with a has-definition flag: to draw definition questions'
      - 'term definitions: of the drawn terms'
      - 'counts, streak, preferences'
    scope: few
    frequency: view
    today:
      requests: 7
      whole: [artworks, glossary_entries, review_cards]
      note: 'review_session takes 332 ms at 1000 artworks (T14)'

  - id: R15
    name: Display case
    route: /atelier/display-case
    shows: exhibits in rooms, tiers, points
    needs:
      - 'career standing (aggregate)'
      - 'exhibit tiers: all'
      - 'exhibit catalogue: all, with the room, the order, hidden and the thresholds (ADR-0228)'
    scope: all
    frequency: view
    today: { requests: 5, whole: [] }

  - id: R16
    name: Forms
    route: artwork, visit, value, term and timeline event edit and new
    shows: the edited record, its notes with link labels, suggestion lists
    needs:
      - 'record: one'
      - 'note link labels: only the ids in the notes'
      - 'suggestions: few, by phrase'
      - 'museum catalogue: search'
      - 'own field definitions: all'
      - 'term: one by id (term form)'
    scope: one
    frequency: view, key
    today:
      requests: '0 new artwork / 8 artwork edit / 9 visit new'
      whole:
        [
          artworks,
          card index,
          catalogue_museums 721 rows,
          glossary_entries (term form takes its entry from the list)
        ]

  - id: R17
    name: Settings and export
    route: /atelier/settings
    shows: profile, preferences, storage, export/import
    needs:
      - 'profile: one'
      - 'storage usage (aggregate)'
      - 'atelier empty (aggregate)'
      - 'export: all tables'
    scope: one
    frequency: view
    today: { requests: 10, whole: [], note: 'profiles read 6x, 6 HEAD counts' }

  - id: R18
    name: Trash
    route: /atelier/trash
    shows: every trashed artwork, and in the tab "Wystawy" every exhibition in Archiwum (from 0.21)
    needs:
      - 'artworks: all trashed, tile columns'
    scope: all
    frequency: view
    today: { requests: 1, whole: [], note: 'justified' }

  - id: R19
    name: Duplicate check
    route: artwork form, on save
    shows: artworks that look like the one being saved
    needs:
      - 'duplicate_candidates: few, by title and authors'
    scope: few
    frequency: write
    today: { requests: 1, whole: [] }

  - id: R20
    name: Career after a review round
    route: /atelier/review, end of round
    shows: points and new tiers
    needs:
      - 'career standing (aggregate)'
    scope: one
    frequency: view
    today: { requests: 4, whole: [], note: 'the same 4 requests as in the shell (T2)' }

  - id: R21
    name: Statistics
    route: /atelier/statistics
    shows: the collection in numbers, its distribution, rankings, gaps, records, reviews and growth
    needs:
      - 'artworks: all, tile columns (the cached collection of the wall)'
      - 'review cards: all (as on the review start)'
      - 'collection_statistics (aggregate): answer sums, additions per day, week or month, counts of terms, events and visits, records from other tables'
    scope: all
    frequency: view
    today:
      {
        requests: 0,
        whole: [],
        note: 'new in 0.18 (ADR-0171); arriving from the wall needs only the aggregate and the cards'
      }

  - id: R22
    name: Exhibitions list
    route: /atelier/exhibitions
    shows: every exhibition outside Archiwum as a poster with its cover, title, number of artworks and last change
    needs:
      - 'exhibitions: all outside Archiwum, light (id, title, updated_at), never the document'
      - 'cover: the artwork at position 0 of exhibition_artworks, its first image'
      - 'count: artworks per exhibition'
    scope: all
    frequency: view
    today:
      {
        requests: 2,
        whole: [],
        note: 'new in 0.21 (ADR-0200, ADR-0211): exhibitions with their artwork rows embedded, then the covers by id; target one RPC exhibition_list'
      }

  - id: R23
    name: Exhibition
    route: /atelier/exhibitions/[id]
    shows: the document with text, heading, quote, artwork and close-up blocks in rows, palettes and live artwork notes
    needs:
      - 'exhibition: one, by id, with the document'
      - 'artworks: few, by the ids in exhibition_artworks, Archiwum included (deleted_at picks the frame), with images, palettes and notes'
      - 'note link labels: only for the artwork notes the document shows (R05)'
      - 'term index: cached, for marking the texts and the shown notes'
    scope: one
    frequency: view
    today:
      {
        requests: 3,
        whole: [],
        note: 'new in 0.21: the exhibition, its artworks by id and the term index'
      }

  - id: R24
    name: Exhibition, edit mode
    route: /atelier/exhibitions/[id] (edit)
    shows: R23 and the side panel "Dodaj do wystawy"
    needs:
      - 'everything of R23'
      - 'panel, recent: few, the 12 artworks added last, tile columns'
      - 'panel, search: few, by phrase (title, author, record number), limit 20, per pause in typing (like R06)'
      - 'a dropped artwork: one, by id, with images, palettes and notes'
    scope: one
    frequency: view, key
    today:
      {
        requests: 0,
        whole: [],
        note: 'new in 0.21; must not load the whole collection for the panel'
      }

  - id: R25
    name: Exhibitions of an artwork
    route: /atelier/[number] (part of R03)
    shows: '"Na N wystawach": the exhibitions outside Archiwum that hold the artwork'
    needs:
      - 'exhibition_artworks: few, by artwork_id, joined to exhibition titles and covers'
    scope: few
    frequency: view, flip
    today:
      {
        requests: 0,
        whole: [],
        note: 'new in 0.21; folded into the artwork page RPC where possible'
      }

  - id: R26
    name: Symbol atlas
    route: /atelier/glossary (tab "Symbole")
    shows: every symbol as a lens with one detail, its name, its first meaning and the counts of details and meanings; search by name, sort by name, date added or detail count
    needs:
      - 'symbols: all, with name and created_at'
      - 'meanings: the first of each, text only'
      - 'counts: pins and meanings per symbol, aggregated in the database'
      - 'cover: one pin crop per symbol; crops signed in one batch'
    scope: all
    frequency: view
    today:
      {
        requests: 1,
        whole: [],
        note: 'ATL-677: one RPC symbol_atlas returning name, created_at, first meaning, counts and the cover pin with its crop path; pins of artworks in the trash are left out; crops signed in one batch'
      }

  - id: R27
    name: Symbol page
    route: /atelier/glossary/symbols/[id]
    shows: one symbol, its meanings in order with context labels and a summary counted from the pinned artworks, the pin lenses grouped by meaning, the pins without a meaning, every lens on an axis of years
    needs:
      - 'symbol: one'
      - 'meanings: of the symbol, ordered, with labels resolved to names (value, era, artwork title, person)'
      - 'pins: of the symbol, with meaning, loupe view, crop path, image and the artwork tile columns plus era, styles and authors'
      - 'summary per meaning: counted in the browser from the loaded pins'
    scope: one
    frequency: view
    today:
      {
        requests: 3,
        whole: [],
        note: 'ATL-677: the symbol with meanings and labels in one select with embeds, its pins with the image in one select, the artworks of those pins through the wall loader (tile columns, era, styles, authors) in one select; crops signed in one batch'
      }

  - id: R28
    name: Symbol picker in the pin dialog
    route: /atelier/[number], /atelier/[number]/edit (pin dialog)
    shows: symbol names to choose from, then the meanings of the chosen symbol when it has two or more
    needs:
      - 'symbol index: all, id and name, with the meaning ids and texts embedded (a few per symbol)'
    scope: all
    frequency: view
    today:
      {
        requests: 0,
        whole: [],
        note: 'ATL-678: one select with the meanings embedded, loaded beside the term index of R03'
      }

  - id: R29
    name: Symbols of a value, attributes of a person
    route: /atelier/values/[kind]/[id], /atelier/glossary/[id]
    shows: the symbols whose meanings carry this value, era or glossary person as a label, with the meaning text
    needs:
      - 'context labels: by value id, era code or glossary entry id, embedding the meaning text and the symbol name'
    scope: few
    frequency: view
    today:
      { requests: 0, whole: [], note: 'new in 0.23; target 1 select filtered by the label column' }

  - id: R30
    name: Symbol extra questions in the review
    route: /atelier/review
    shows: 1 to 3 extra questions with a pin crop asking for the symbol, its meaning here or the person it belongs to
    needs:
      - 'pins with a symbol and a crop: few, random, with symbol name, meaning text and person label'
      - 'other answers: other symbol names, meaning texts and glossary persons'
    scope: few
    frequency: view
    today:
      {
        requests: 0,
        whole: [],
        note: 'new in 0.23 (ADR-0257, like ADR-0153); target 1 request at the session start'
      }

  - id: R31
    name: Relations of an artwork
    route: /atelier/[number] (part of R03) and its edit form
    shows: '"Powiązania": the related artworks outside the trash, grouped by the name of the type seen from this artwork'
    needs:
      - 'artwork_relations: few, by from_id or to_id, joined to the other artwork (id, record_number, title, authors and year for the search row)'
    scope: few
    frequency: view, flip
    today:
      {
        requests: 0,
        whole: [],
        note: 'new in 0.23 (ADR-0259); read with the artwork, not as a request of its own'
      }

  - id: R32
    name: Relations of an author
    route: /atelier/values/author/[id] (part of R07) and its edit form
    shows: 'a block of the "Powiązania" band: the related authors, grouped by the name of the type seen from this author'
    needs:
      - 'author_relations: few, by from_id or to_id, joined to the name of the other author'
    scope: few
    frequency: view
    today: { requests: 0, whole: [], note: 'new in 0.23 (ADR-0259); part of value_page_content' }

  - id: R33
    name: Map
    route: /atelier/map
    shows: 'every city with artworks at places with a point, as a circle with a count, gold when seen; a city panel with its places and thumbnails; the places without a point for "Uzupełnij położenie"'
    needs:
      - 'places: all location values with their point (value id, name, latitude, longitude, place type, country)'
      - 'visit_artworks: artwork ids seen in person (as for the wall filter "Widziane na żywo")'
      - 'artworks: tile columns, want_to_see and their place, from the cached collection of the wall'
      - 'cities: derived in the browser from the bundled Natural Earth populated places, never read'
    scope: all
    frequency: view
    today:
      {
        requests: 0,
        whole: [],
        note: 'new in 0.23 (ADR-0260); target 1 request for the places with their details, the rest from the wall cache'
      }

writes:
  - id: W01
    name: Save artwork
    changes: [artwork, images, values, own field entries, notes]
    side_effects: [card index counts, wall, timeline, review facts]
    frequency: write
  - id: W02
    name: Save a note (any of the 8 notes columns)
    changes: [note body]
    side_effects: [links from the note, term occurrences in the note, mentions of targets]
    frequency: write
  - id: W03
    name: Merge two values
    changes: [artwork_values, visits, links, details]
    side_effects:
      - 'link hrefs to the merged value are rewritten in 7 notes columns; era_details.notes is skipped today (a bug)'
      - 'a rename rewrites nothing, because labels resolve live'
    frequency: write
  - id: W04
    name: Add, edit or delete a term (name, synonyms, forms, definition)
    changes: [term]
    side_effects:
      - 'marking in every note, definition and flashcard'
      - 'mentions on the entry page'
      - 'today neither save nor delete clears the data cache (a bug)'
    frequency: write
  - id: W05
    name: Delete or trash an artwork, value, term, visit
    changes: [the row]
    side_effects:
      [dangling note links, pins, visits, review cards, the NoImage frame in exhibitions]
    frequency: write
  - id: W06
    name: Import an atelier export
    changes: [all owner tables]
    side_effects:
      [
        must accept every older export format,
        exhibition_artworks rebuilt from the documents at the end
      ]
    frequency: rare
  - id: W07
    name: Save or delete a pin
    changes: [artwork_pins]
    side_effects: [term pins on the entry page, pin quizzes in review]
    frequency: write
  - id: W08
    name: Answer in review
    changes: [review_cards, review_log, free_review_days, point_events]
    side_effects:
      [counters, streak, career points, a point for a right answer about time or a definition]
    frequency: write
  - id: W09
    name: Toggle favourite
    changes: [artworks.favourite]
    side_effects: [wall filter]
    frequency: write
  - id: W10
    name: Save or delete a timeline event
    changes: [timeline_events]
    side_effects: [timeline, card index events]
    frequency: write
  - id: W11
    name: Change own fields and own values
    changes: [artwork_fields, categories, category_values, artwork_field_entries]
    side_effects: [form fields, card index, merge of own values, move_artwork_field]
    frequency: write
  - id: W12
    name: Link periods to eras and styles to periods, delete an unused value
    changes: [period_eras, style_periods, category_values]
    side_effects: [artwork eras moved, card index tree]
    frequency: write
  - id: W13
    name: Save profile, preferences, legal acceptance, seen rank
    changes: [profiles]
    side_effects: [shell, review settings]
    frequency: write
  - id: W14
    name: Unlock exhibits
    changes: [exhibit_tiers, point_events]
    side_effects: [runs on the read path of the shell and after writes]
    frequency: start
  - id: W15
    name: Send feedback
    changes: [feedback]
    side_effects: []
    frequency: rare
  - id: W16
    name: Delete the account
    changes: [every owner table, storage]
    side_effects: [cascades from auth.users]
    frequency: rare
  - id: W17
    name: Restore or purge from the trash
    changes: [artworks.deleted_at, artworks]
    side_effects:
      [
        links and mentions come back on restore; purge cascades,
        an exhibition shows the NoImage frame in place of a purged artwork
      ]
    frequency: write
  - id: W18
    name: Create an exhibition
    changes: [exhibitions]
    side_effects: [list, limit of 200 exhibitions per account]
    frequency: write
  - id: W19
    name: Autosave an exhibition (title and document)
    changes: [exhibitions, exhibition_artworks]
    side_effects:
      - '"Na wystawach" of every artwork added or removed'
      - 'cover and count on the list'
      - 'a save with an older revision is refused'
    frequency: 'write, a few seconds after the last change'
  - id: W20
    name: Move an exhibition to Archiwum
    changes: [exhibitions.deleted_at]
    side_effects: [list, '"Na wystawach" of its artworks']
    frequency: rare
  - id: W21
    name: Restore or purge an exhibition
    changes: [exhibitions.deleted_at, exhibitions, exhibition_artworks]
    side_effects:
      ['restore brings back "Na wystawach"; purge cascades exhibition_artworks; the artworks stay']
    frequency: rare
  - id: W22
    name: Store the palette of an image
    changes: [artwork_images.palette]
    side_effects: [palette in exhibitions and the artwork view]
    frequency: 'write, on saving an image, or once on the first show of an older image'

  - id: W23
    name: Save or delete a symbol with its meanings and labels
    changes: [symbols, symbol_meanings, symbol_meaning_contexts]
    side_effects:
      [
        atlas,
        symbol page,
        value pages and person pages that list it,
        pin picker,
        review extra questions
      ]
    frequency: write
    note: 'one RPC replaces the meanings and labels in order; deleting a symbol clears it from its pins'

  - id: W24
    name: Save a pin with a symbol
    changes: [artwork_pins.symbol_id, artwork_pins.symbol_meaning_id]
    side_effects: [symbol page, atlas counts and cover, review extra questions]
    frequency: write
    note: 'extends saving a pin; the meaning must belong to the symbol'

  - id: W25
    name: Save the relations of an artwork
    changes: [artwork_relations]
    side_effects: ['"Powiązania" of both artworks']
    frequency: 'write, with the artwork form (save_artwork replaces the full list)'

  - id: W26
    name: Save the relations of an author
    changes: [author_relations]
    side_effects: ['"Powiązania" band of both authors']
    frequency: 'write, with the author form (save_value_details replaces the full list); merge_category_values moves them'

  - id: W27
    name: Mark an artwork to see
    changes: [artworks.want_to_see]
    side_effects: ['wall filter "Chcę zobaczyć"', 'map filter "Chcę zobaczyć"']
    frequency: write
    note: 'one update of the column, like the favourite heart'

  - id: W28
    name: Set the position of a place
    changes: [location_details.latitude, location_details.longitude, location_details.wikidata_id]
    side_effects: [map, the count of places without a point]
    frequency: 'write, from the place page or the fill-in mode of the map; a new place from the starter list takes its point by a trigger'
    note: 'set_place_point(place, latitude, longitude, wikidata_id) upserts the point; a trigger on visit_artworks clears want_to_see of the artworks a visit holds (ADR-0260)'

relations:
  # Every relation the app shows, whether stored or computed today.
  - { from: artwork, to: value, kind: has_value, stored: artwork_values }
  - { from: period, to: era, kind: in_era, stored: period_eras }
  - { from: style, to: period, kind: in_period, stored: style_periods }
  - { from: visit, to: place, kind: at_place, stored: visits.place_id }
  - { from: visit, to: artwork, kind: saw, stored: visit_artworks }
  - {
      from: place,
      to: city,
      kind: lies_in,
      stored: 'no, nearest Natural Earth town to location_details point'
    }
  - {
      from: exhibition,
      to: artwork,
      kind: shows,
      stored: 'exhibition_artworks, written by save_exhibition from the document'
    }
  - { from: exhibition block, to: image, kind: shows_image, stored: 'no, imageId in the document' }
  - { from: artwork, to: artwork, kind: 'typed relation (ADR-0259)', stored: artwork_relations }
  - { from: author, to: author, kind: 'typed relation (ADR-0259)', stored: author_relations }
  - { from: pin, to: term, kind: pinned_term, stored: artwork_pins.glossary_entry_id }
  - { from: pin, to: symbol, kind: shows_symbol, stored: artwork_pins.symbol_id }
  - { from: pin, to: meaning, kind: means_here, stored: artwork_pins.symbol_meaning_id }
  - {
      from: meaning,
      to: 'value, era, artwork, person',
      kind: labelled_by,
      stored: symbol_meaning_contexts
    }
  - { from: note, to: artwork, kind: links_to, stored: 'no, Markdown text ](/atelier/n)' }
  - {
      from: note,
      to: value,
      kind: links_to,
      stored: 'no, Markdown text ](/atelier/values/kind/id)'
    }
  - {
      from: note,
      to: term,
      kind: mentions_term,
      stored: 'no, matched in the browser on name, synonyms and forms'
    }
  - {
      from: target,
      to: note,
      kind: mentioned_in,
      stored: 'no, notes_mentions LIKE over 8 notes columns'
    }
