out_of_scope:
  - 'E2: remembering Wikidata and Wikipedia search results; only if 429 errors come back'
  - '5.3: a counter instead of count(*) in limit_rows; only if pg_stat_statements shows it'
  - 'Live term marking in the notes editor'
  - 'The chronicle loads the whole collection for its artwork counts; acceptable while the view shows all visits'

delivery:
  # Pull requests in order; each is one thread. Request counts are re-measured after each.
  - 'P0: pnpm screenshot --log-requests and a baseline per view, shell and view apart, with payload sizes'
  - 'B1 and B2 (bugs)'
  - 'T5 (bug)'
  - 'T1 + T2'
  - 'Q2 (term_mentions; the old notes_mentions stays)'
  - 'T8 with its ADR'
  - 'Q1 (two PRs: index and tooltip, then review and pins)'
  - 'Z4, Z5'
  - 'M1 migration with the backfill (0.16)'
  - 'M1 reads with an ADR superseding ADR-0082 (0.16); notes_mentions(needle text) dropped in a later release'
  - 'Z2 remainder, Z3'
  - 'T4 after D3'
  - "M4 before Q2 if the measurement shows the scan; M3 + the rest of M4, T3', T7, T9, T11, T12, T14, T13 after the measurement"
  - 'ATL-395 (fewer database requests) is covered by Z1, Z2, T1 and T4 and closes with them'

adrs_to_change:
  - { adr: '0082', by: [M1, Q2], how: 'superseded: mentions from note_links and term_mentions' }
  - { adr: '0157', by: [T8, Q1], how: 'amended: keyed forgetting and the glossary keys' }
  - { adr: '0042', by: [Z4, Z5], how: 'amended: the whole collection only in views that show it' }
  - { adr: '0048', by: [T4], how: 'amended if the preload is narrowed' }
  - { adr: '0053', by: [M1, Z3], how: 'amended: link labels and suggestions from the database' }
  - { adr: '0126', by: [Q1], how: 'respected: the definition loader is passed into packages/ui' }

alternatives:
  - id: X1
    name: Store term mentions as rows (M2 of the first proposal)
    instead_of: [Q2]
    size: large
    gives: 'The entry page reads its mentions by term id without scanning notes.'
    loses: 'The matching rule in SQL and in the browser with parity tests, a rescan of every note on each term save, and a match against every term on each note save. Worth it only if Q2 becomes slow.'
  - id: X2
    name: One notes table for every subject
    instead_of: ['the 8 notes columns']
    size: large
    gives: 'One source column instead of four in M1.'
    loses: 'Notes leave the row they describe; every save function, the export format and import of older exports change.'
  - id: X3
    name: Notes as editor JSON with id-bearing link nodes
    instead_of: ['Markdown notes']
    size: large
    gives: 'Nothing over M1: the Markdown links already carry the record number or value id.'
    loses: 'Plain-text notes in the export; a conversion of every note.'
  - id: X4
    name: A graph database next to Postgres
    instead_of: [M1]
    size: large
    gives: 'Traversals over many hops, which no view needs.'
    loses: 'A second store to sync, no Row Level Security, no Supabase hosting.'
  - id: X5
    name: The whole glossary with definitions in the cache
    instead_of: [Q1]
    size: small
    gives: 'A tooltip opens with no request.'
    loses: 'An estimated 150-600 kB per session for 300 terms (read-only query 11 measures it), also when no note is opened.'
  - id: X6
    name: Load the definitions of the terms marked in the open note in one request
    instead_of: ['the hover load of Q1']
    size: small
    gives: 'No wait on the first hover or tap, which matters on a phone; still read by ids with no filtering in the app.'
    loses: 'One request per note view even when no tooltip is opened; definitions of terms the learner never points at.'

