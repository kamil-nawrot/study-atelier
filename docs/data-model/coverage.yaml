decisions:
  - id: D1
    question: 'How are term mentions served: rows (X1) or a cached term index plus a filter in the database (Q1, Q2)?'
    decided: 'Q1 and Q2; X1 only if Q2 becomes slow. A tooltip loads its content on hover when it is one row by id (owner, 2026-10-31)'
  - id: D2
    question: 'Keep current.dbml in step with the migrations by a check in CI?'
    recommended: 'yes: commit the generator and run it in the job that already applies the migrations to a local Supabase'
  - id: D3
    question: 'Next artwork preload (T4): code only, the core only, or as today?'
    recommended: 'the core only (artwork and first image), the rest after the flip'
  - id: D4
    question: 'Tooltip definitions: load on hover (Q1) or with the note in one request (X6)?'
    decided: 'on hover, by the tooltip rule of D1 (owner, 2026-10-31); X6 only if the first tap on a phone feels slow'
