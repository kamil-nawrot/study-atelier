# Step 4 of the data model: coverage, cost and loss.
# changes: what the model changes (M: schema in target.dbml, Q: queries and cache without a schema change),
# what each change costs and what it gives up.
# Cost is counted in pull requests and risk, not in days: in this project a change of this size is one
# pull request in one thread, reviewed the same day.
# patterns: how each access pattern of access-patterns.yaml is served before and after. Request counts are
# the view's own requests on a cold start, without the shell (R01); targets are estimates until the first
# delivery step measures them.
# Reviewed on 2026-10-31 by two rounds of four independent reviewers; the findings that change the design
# are folded in, the precision of cost lists and request counts is left to the implementation pull requests.

changes:
  - id: M1
    name: Store note links as rows
    status: 'done in 0.16, ATL-419, ADR-0168; notes_mentions is dropped by ATL-429'
    kind: schema
    tables: [note_links]
    serves: [R03, R05, R07, R13, R16, W03, W05, W17]
    # R13 only for its note link labels; a visit is never a link target.
    requires: [B1]
    pull_requests: 2
    risk: medium
    risk_because: 'triggers on 8 notes columns that must never abort a save, and a backfill of every note on production'
    how: >
      A trigger on every notes column (artworks, the five *_details tables, era_details, visits) reads the links
      ](/atelier/<number>) and ](/atelier/values/<kind>/<id>) out of the Markdown and replaces the rows of that
      note. The Markdown stays the source; the rows can always be rebuilt from it. "Wspomniane w" and the link
      labels read note_links; notes_mentions(needle text) is dropped in a later release, once no deployed
      bundle calls it. Visits are sources of links, not targets: no view shows mentions of a visit.
    design:
      - 'Unique key (owner_id, every source column, every target column) with nulls not distinct. Era codes are shared by all accounts, so a key without owner_id collides.'
      - 'Primary key: id bigint generated always as identity; the unique key above stays for the rebuild.'
      - 'Two AFTER row triggers per table: one on INSERT when new.notes is not null, one on UPDATE OF notes WHEN old.notes IS DISTINCT FROM new.notes (a change to null deletes the rows). Notes arrive by insert in save_artwork, save_visit and the *_details upserts. The five value details tables also get an AFTER DELETE trigger, because a learner may delete a details row while its value stays.'
      - 'The trigger function lives in private, is security definer with search_path empty, and takes owner_id from the row (auth.uid() is null in the backfill and the import). Because it bypasses Row Level Security, every delete and insert it makes filters by that owner_id; era codes are shared by all accounts.'
      - 'It never aborts the save: candidates are checked for format before any cast (record number length, uuid shape, the kind whitelist of the editor), and rows are inserted only through joins to artworks, category_values (with the kind matching category_code) and eras filtered by the same owner, with distinct targets. Targets are locked with for key share, so a target deleted by another tab cannot fail the foreign key check.'
      - 'Safety net: the trigger body catches any exception, leaves the rows the note had and lets the save go on; a later save or a rebuild fills the rows. Every swallowed exception is counted in a private table, so a silent failure shows in a query.'
      - 'Links inside code spans are extracted too, as the LIKE scan does today; accepted.'
      - 'Every read of note_links filters trashed artworks on both sides, as the labels and mentions do today.'
      - 'import_atelier skips the trigger through the existing study_atelier.importing setting and calls private.rebuild_note_links(owner) at its end, because it inserts artworks before values, eras and visits.'
      - 'Row limit: no limit_rows on note_links; instead at most 200 links per note, extra links are ignored. A limit hit would otherwise abort a note save with a generic error.'
    cost:
      - 'migration: table, RLS (select for the owner), revoke all from anon and authenticated before the select grant (Supabase default privileges grant everything), extract function, insert and update triggers on 8 columns'
      - 'revoke execute on private.rebuild_note_links from public, anon and authenticated'
      - 'backfill per owner through private.rebuild_note_links, in the same migration'
      - 'note_link_mentions(target) for "Wspomniane w"; link labels read note_links joined to names'
      - 'import_atelier: skip during import, rebuild at the end'
      - "SQL tests: extraction, malformed links, other owners' ids, era links of two accounts, cascade on delete, trash and restore, merge, import of an old export; added to migrations.yml"
      - 'security.sql fixture gets a note with a link (it asserts a row in every owned table)'
      - 'database.types.ts generated, not written by hand (CI compares it byte for byte)'
      - 'screenshot fixtures and mocks for the new reads'
    rollout:
      - 'One release (0.16), two pull requests. Pull request 1: the migration alone, backward compatible. It creates the table and the triggers first, then backfills every owner through private.rebuild_note_links in the same transaction, so no save falls between the two, and fails if any note could not be stored.'
      - 'Verification after the backfill: a second rebuild into a temporary table must equal note_links row for row; a LIKE count is only a sanity check, because it cannot see the format checks.'
      - 'Before the release: read-only queries on production (notes with links per table, links per note, links to missing targets), and a dry run of the migration on a copy of production in DEV, following docs/guidelines/hosted-environments.md.'
      - 'Pull request 2, same release: the app reads note_links and note_link_mentions. notes_mentions(needle text) stays in the database and is dropped in a later release, when no deployed bundle calls it (ADR-0139).'
      - 'Rollback: a prepared migration that drops the triggers (the table stays). Because notes_mentions stays, reverting the app reads brings back the old mentions at once.'
    loses:
      - 'Every note save does more work: delete and insert of its link rows inside the save transaction.'
      - 'A link to a record number that does not exist is not stored; it starts to count only after the note is saved again.'
      - 'The link grammar lives in two places: the editor that writes it and the SQL that reads it. A change to the link format needs both.'
      - 'Four source and three target columns instead of one polymorphic pair: more columns and partial indexes, in exchange for real foreign keys and cascades.'
    keeps:
      - 'Notes stay Markdown; the export format does not change, because note_links is derived and not exported.'

  - id: Q1
    name: Keep a light term index in the cache and load a definition on hover
    status: 'done in 0.16, ATL-414 and ATL-415'
    kind: query
    tables: []
    serves: [R03, R04, R07, R10, R13, R14, R16]
    requires: [B2, T8]
    schema: "glossary_entries.has_definition boolean generated always as (coalesce(btrim(definition), '') <> '') stored, so PostgREST can select it; the same rule as review uses for a blank definition"
    pull_requests: 2
    risk: medium
    risk_because: 'T8 must forget exactly the keys a write changes; a missed key shows stale data'
    how: >
      The terms to mark (id, name, synonyms, forms, category, has_definition) are loaded once per session through
      cached('glossary-index'), which replaces today's cached('glossary'). Every view that shows a note loads only
      that note and marks its terms with the cached index. A tooltip shows the name and category from the index at
      once and loads the definition and source of its one term by id into cached('glossary-term:<id>') on the first
      hover, focus or tap. Review draws definition questions from the index and loads the definitions of the drawn
      terms in one request before the session. Rule: what a tooltip shows may load on hover when it is one row by id,
      with no filtering in the app.
    design:
      - 'The index is awaited in the page load, so marked terms do not shift the layout.'
      - 'The cache drops the index and the definitions on a glossary write (B2, T8 with forget by prefix), on account switch, after the 10-minute break and on import.'
      - 'Tooltip: loading starts when the card opens (after its open delay, on focus or on tap), not on every pointerover, and only for a term whose index row says it has a definition. A placeholder of fixed height while loading, the card re-placed when its content changes (a change in PopoverCard), the definition announced through aria-describedby of the term rather than a live region inside the hidden tooltip, and states for a deleted term and for a failed load. A failed load is not cached, so the next open retries; an answer for a term whose card is no longer open is stored but not shown. A loaded definition does not change the terms passed to the note, so the open popover does not close.'
      - 'Other tabs: the broadcast only clears their cache, so a tab shows the new index or definition on its next load, not at once. A change of the signed-in learner clears the whole cache, and a result read without a session is never cached.'
      - 'The pin card loads the definition of its term when opened; the pin dialog lists terms from the index. Pins move in the first pull request together with the tooltip, so no release has a pin card without a definition.'
      - 'Review loads the definitions of the drawn terms in the review page load, in one request by id in (...); if it fails, the session runs without definition questions and says so.'
      - 'The term form loads its entry by id and takes every name (duplicate check) from the index.'
    cost:
      - 'loadTermIndex through cached() wherever a note, definition or flashcard is shown'
      - 'migration: the generated has_definition column'
      - 'loadTermDefinition(id) and the tooltip states in GlossaryTermCard, re-placing in PopoverCard; packages/ui keeps no Supabase access (ADR-0126)'
      - 'the GlossaryEntry list passed through the note, pin, flashcard and form components becomes the index type'
      - 'review: has_definition in the index, definitions of the drawn terms in one request'
      - 'pins and the term form as in design'
      - 'tests: one index request per session, one definition request per term, a glossary write refreshes both, other tabs follow; component tests of the tooltip states'
      - 'screenshot mocks: the glossary mock honours select= and id=in.'
    loses:
      - 'The first hover or tap of each term waits for one request before the definition shows; on a phone every first tap shows the placeholder.'
      - 'A change made in another tab or on another device shows on the next load of the view, not at once; today most views read the glossary on every visit. The owner accepts this or T8 makes views reload on a broadcast.'
    keeps:
      - 'One matching rule, termPattern in packages/ui notes-markdown. The notes editor marks no terms today and the model does not add it.'
      - 'The glossary list (R09) still reads the whole table, because it shows every term with its definition lead.'

  - id: Q2
    name: Filter note mentions of a term in the database
    status: 'done in 0.16, ATL-412'
    kind: query
    tables: []
    serves: [R10]
    pull_requests: 1
    risk: medium
    risk_because: 'the database filter must find every note the browser marks, and its speed at a few thousand notes is measured, not assumed'
    how: >
      A new function term_mentions(needles text[]) returns only the notes that contain one of the term's phrases
      (name, synonyms, forms), with the title of each artwork and the name of each value, so the entry page no
      longer loads the card index. The browser confirms the exact match on those notes with termPattern, because
      the filter also finds a phrase inside a longer word. It is a new name, not a new signature of
      notes_mentions(needle text): the artwork and value pages call the old function until the M1 reads, which
      drop it. Null or an empty array returns no rows.
    cost:
      - 'migration: term_mentions; the old notes_mentions stays'
      - 'filter: the phrases are trimmed, blank and duplicate ones dropped, regex metacharacters escaped, and every run of spaces in a phrase becomes \\s+, then one case-insensitive regex per note (notes ~* pattern), because the browser treats any whitespace as a space and ilike needs exactly one'
      - 'measurement before the choice, on a seed of 3000 notes of 1.6 kB with 8 phrases (one table): ilike any 393 ms, lower(notes) like any 116 ms, one regex 60 ms, today unfiltered 68 ms for 6000 notes; the regex is chosen unless the P0 seed says otherwise'
      - 'case folding of Ł, Ś and other Polish capitals tested on the database collation of production'
      - 'M4 adds owner_id indexes on the five *_details tables, which every scan of this function filters by'
      - 'loadGlossaryMentions passes the phrases; SQL test for the filter, the escaping and the empty array'
      - 'screenshot mock for term_mentions'
    loses:
      - 'The notes of 8 tables are still scanned on every opening of an entry page: about 60 ms per table at 3000 notes with the regex, so the entry page may get slower for a large account while its payload shrinks.'
      - 'A phrase inside a link URL or link text passes the filter and is dropped by the browser; harmless, a little extra payload.'
      - 'The request count of R10 does not drop; the payload does, from every note of the account to the matching ones.'
      - 'Era names live in the app texts, so an era mention still gets its name in the browser.'
    keeps:
      - 'No new table and no write cost: adding a term matches old notes at once.'
      - 'If the scan grows slow, the answer is X1 (rows), not a pg_trgm index: a trigram index is not used under Row Level Security, because the operator is not leakproof (measured: 369 ms sequential scan as authenticated).'

  - id: M3
    name: Drop the unused author portrait source column
    kind: schema
    tables: [author_details]
    serves: []
    pull_requests: 1
    risk: low
    risk_because: 'one small migration, shared with M4'
    how: 'Drop author_details.own_image_source_url and rewrite save_value_details, its only reader, in the same migration.'
    cost:
      - 'migration with the function rewrite, database.types.ts generated'
    loses:
      - 'Nothing the app shows; import already ignores unknown columns of older exports.'

  - id: M4
    name: Index the foreign keys behind cascading deletes
    kind: schema
    tables:
      [
        artwork_pins,
        category_values,
        period_details,
        style_details,
        material_details,
        author_details,
        location_details
      ]
    serves: [W11, W16, R10]
    pull_requests: 0
    risk: low
    risk_because: 'goes in the M3 pull request'
    how: 'Index artwork_pins(owner_id) and category_values(category_code), and owner_id on the five *_details tables, which term_mentions scans by owner.'
    cost:
      - 'migration'
    loses:
      - 'Seven more indexes to write on insert.'

