# Step 4 of the data model: coverage, cost and loss.
# changes: what the model changes (M: schema in target.dbml, Q: queries and cache without a schema change),
# what each change costs and what it gives up.
# patterns: how each access pattern of access-patterns.yaml is served before and after.
# Effort: S up to half a day, M one or two days, L more. Request counts after the change are estimates.

changes:
  - id: M1
    name: Store note links as rows
    kind: schema
    tables: [note_links]
    serves: [R03, R05, R07, R13, W03, W05]
    how: >
      A trigger on every notes column (artworks, the five *_details tables, era_details, visits)
      reads the links ](/atelier/<number>) and ](/atelier/values/<kind>/<id>) out of the Markdown and
      replaces the rows of that note. The Markdown stays the source; the rows can always be rebuilt from it.
    cost:
      - {
          item: 'migration: table, RLS, row limit, extract function, triggers on 8 columns',
          effort: M
        }
      - { item: 'backfill of every existing note in the same migration', effort: S }
      - { item: 'rebuild_note_index() for drift and for import', effort: S }
      - {
          item: "notes_mentions answers 'Wspomniane w' from note_links instead of LIKE over 8 tables (ADR-0082 superseded)",
          effort: S
        }
      - {
          item: 'SQL tests: extraction, cascade on delete, trash, merge, import of an old export',
          effort: M
        }
      - { item: 'database.types.ts by hand, screenshot mocks for the new reads', effort: S }
    loses:
      - 'Every note save does more work: delete and insert of its link rows inside the save transaction.'
      - 'A link to a record number that does not exist is not stored; it starts to count only after the note is saved again.'
      - 'The link pattern lives in two places: the editor that writes it and the SQL that reads it. A change to the link format needs both.'
      - 'Four source and three target columns instead of one polymorphic pair: more columns and partial indexes, in exchange for real foreign keys and cascades.'
    keeps:
      - 'Notes stay Markdown; the export format does not change, because note_links is derived and not exported.'
      - 'merge_category_values still rewrites the link text; the trigger then moves the rows.'

  - id: Q1
    name: Keep the whole glossary in the cache and match terms in the browser
    kind: query
    tables: []
    serves: [R03, R04, R07, R13, R14, R16]
    requires: [T8]
    how: >
      The glossary is loaded once per session through cached('glossary') with its definitions and sources,
      and dropped only by a glossary write (add, edit, delete). Every view that shows a note loads only that
      note and marks its terms with the cached list, as the browser does today; tooltips read the definition
      from the same cache, so a hover makes no request.
    cost:
      - {
          item: 'loadGlossary through cached() wherever a note or flashcard is shown; the entry page reads its entry from the cache',
          effort: S
        }
      - {
          item: 'T8: a write forgets only the cache keys it changes, so a favourite or a visit does not drop the glossary',
          effort: M
        }
      - {
          item: 'tests: one glossary request per session, a glossary write refreshes it, other tabs follow',
          effort: S
        }
    loses:
      - 'The whole glossary with definitions travels once per session, also when the learner opens no note: an estimated 150-600 kB for 300 terms (read-only query 11 measures it).'
      - 'A change made on another device shows after a reload. Other tabs of the same browser follow at once, because forgetCached is broadcast.'
      - 'Until T8 lands, every write drops the cached glossary and the next note view downloads it again.'
    keeps:
      - 'One matching rule, in packages/ui notes-markdown, for viewing and for the live marking in the editor.'

  - id: Q2
    name: Filter note mentions of a term in the database
    kind: query
    tables: []
    serves: [R10]
    how: >
      notes_mentions takes the term's phrases (name, synonyms, forms) and returns only the notes that contain
      one of them (notes ilike any(...)), with the title or name of each. The browser confirms the exact match
      on those few notes with the same rule as today, because ilike also finds a phrase inside a longer word.
    cost:
      - {
          item: 'migration: needles text[] parameter on notes_mentions, escaping as today',
          effort: S
        }
      - {
          item: 'loadGlossaryMentions passes the phrases; SQL test for the filter and the escaping',
          effort: S
        }
    loses:
      - 'The notes of 8 tables are still scanned on every opening of an entry page; a few thousand rows of one account, milliseconds today.'
      - "A term with a short form (for example 'łuk' inside 'łukowy') returns notes the browser then discards."
    keeps:
      - 'No new table and no write cost: adding a term matches old notes at once.'
      - 'If the scan grows slow, a pg_trgm index on the notes columns speeds up ilike without changing the model.'

  - id: M3
    name: Drop the unused author portrait source column
    kind: schema
    tables: [author_details]
    serves: []
    how: 'Drop author_details.own_image_source_url and its handling in save_value_details.'
    cost:
      - { item: 'migration, function update, database.types.ts', effort: S }
      - { item: 'import_atelier ignores the column in older exports', effort: S }
    loses:
      - 'Nothing the app shows; older exports carry a value that is no longer kept.'

  - id: M4
    name: Index the foreign keys behind cascading deletes
    kind: schema
    tables: [artwork_pins, category_values]
    serves: []
    how: 'Index artwork_pins(owner_id) and category_values(category_code).'
    cost:
      - { item: 'migration', effort: S }
    loses:
      - 'Two more indexes to write on insert.'

alternatives:
  - id: A1
    name: Store term mentions as rows (M2 of the first proposal)
    instead_of: [Q2]
    cost: L
    gives: 'The entry page reads its mentions by term id without scanning notes.'
    loses: 'The matching rule in SQL and in the browser, parity tests, a rescan of every note on each term save, and a match against every term on each note save. Worth it only if Q2 becomes slow.'
  - id: A2
    name: One notes table for every subject
    instead_of: 'the 8 notes columns'
    cost: L
    gives: 'One source column instead of four in M1.'
    loses: 'Notes leave the row they describe; every save function, the export format and import of older exports change.'
  - id: A3
    name: Notes as editor JSON with id-bearing link nodes
    instead_of: 'Markdown notes'
    cost: L
    gives: 'Nothing over M1: the Markdown links already carry the record number or value id.'
    loses: 'Plain-text notes in the export; a conversion of every note.'
  - id: A4
    name: A graph database next to Postgres
    instead_of: [M1]
    cost: L
    gives: 'Traversals over many hops, which no view needs.'
    loses: 'A second store to sync, no Row Level Security, no Supabase hosting.'
  - id: A5
    name: A light term index in the cache and a definition fetched on hover (Z1 of the report)
    instead_of: [Q1]
    cost: M
    gives: 'A smaller download per session.'
    loses: 'A request on every first hover of a term, and two loaders for the glossary.'

patterns:
  # today: requests measured on 2026-10-30. target: after M1, Q1, Q2 and the query tasks named in also.
  - { id: R01, today: 10, target: 5, model: none, also: [T1, T2] }
  - { id: R02, today: 2, target: 2, model: none, also: [] }
  - id: R03
    today: '27 cold / 18 per flip'
    target: 'about 7 cold / 3 per flip'
    model: [M1, Q1]
    also: [Z2, T1, T4]
    reads_after:
      - 'artwork by record_number with images'
      - 'pins with term name'
      - 'value summaries, visits'
      - 'note_links where source_artwork_id = id, joined to target names (link labels)'
      - 'note_links where target_artwork_id = id, joined to source names (mentions)'
      - 'terms marked from the cached glossary; tooltips from the same cache'
    no_longer:
      [
        glossary_entries select * per view,
        artworks for labels,
        card index for labels,
        notes of every table
      ]
  - {
      id: R04,
      today: '0, from the whole glossary loaded by the page',
      target: '0, from the cached glossary',
      model: [Q1],
      also: []
    }
  - { id: R05, today: 6, target: 'part of R03', model: [M1], also: [Z2] }
  - {
      id: R06,
      today: 'whole artworks and card index',
      target: '1 search per pause in typing',
      model: none,
      also: [Z3]
    }
  - { id: R07, today: '19 cold / 8 warm', target: 'about 6', model: [M1, Q1], also: [Z4] }
  - { id: R08, today: 7, target: 7, model: none, also: [T9] }
  - { id: R09, today: 1, target: '1, the same cache as Q1', model: [Q1], also: [] }
  - id: R10
    today: 13
    target: 'about 4'
    model: [Q2, Q1]
    also: [Z5]
    reads_after:
      - 'term from the cached glossary'
      - 'artworks pinned with the term'
      - 'notes_mentions(needles) returns only the notes containing a phrase; the browser confirms the exact match'
    no_longer: [artworks, glossary_entries, notes of every table]
  - { id: R11, today: 2, target: 2, model: none, also: [] }
  - { id: R12, today: 2, target: 2, model: none, also: [] }
  - { id: R13, today: 19, target: 'about 5', model: [M1, Q1], also: [Z5] }
  - { id: R14, today: 17, target: 'about 10', model: [Q1], also: [T1, T14] }
  - { id: R15, today: 5, target: 3, model: none, also: [T2] }
  - { id: R16, today: '8-19', target: 'about 5', model: [Q1], also: [Z3, T3'] }
  - { id: R17, today: 20, target: 'about 12', model: none, also: [T1, T11] }

writes:
  - {
      id: W01,
      today: 'save_artwork',
      after: 'save_artwork + the M1 trigger on the notes',
      model: [M1]
    }
  - {
      id: W02,
      today: 'one update',
      after: 'one update + delete and insert of its link rows',
      model: [M1]
    }
  - {
      id: W03,
      today: 'merge rewrites link text',
      after: 'the same; the trigger moves the rows',
      model: [M1]
    }
  - {
      id: W04,
      today: 'one row',
      after: 'one row; the cached glossary is dropped in every tab and loaded again',
      model: [Q1]
    }
  - {
      id: W05,
      today: 'links in text dangle',
      after: 'link rows go with the deleted subject; trash keeps them',
      model: [M1]
    }
  - {
      id: W06,
      today: 'import_atelier',
      after: 'import_atelier with the trigger off, then one rebuild',
      model: [M1]
    }

decisions:
  - id: D1
    question: 'How are term mentions served: rows (A1) or the cached glossary plus a filter in the database (Q1, Q2)?'
    decided: 'Q1 and Q2; A1 only if Q2 becomes slow (owner, 2026-10-31)'
  - id: D2
    question: 'Keep current.dbml in step with the migrations by a check in CI?'
    recommended: 'yes, in the job that already applies the migrations to a local Supabase'
